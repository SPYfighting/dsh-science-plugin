- insert:
    - id: dsh-science
      name: dsh-science-plugin
    # Older Web profiles lack one or both card entries. Honor any host-configured
    # entry (including disabled entries) and only supply the missing component.
    - id: dsh-science-legacy-cards-host
      name: '@deepseek-ai/dsh-action-cards'
      disabled: !!js "ctx[Symbol.for('cordis.entry')].parent.data.some(row => row.name === '@deepseek-ai/dsh-action-cards' && row.id !== 'dsh-science-legacy-cards-host')"
    - id: dsh-science-legacy-cards-client
      name: '@deepseek-ai/dsh-client-ui-action-cards'
      disabled: !!js "ctx[Symbol.for('cordis.entry')].parent.data.some(row => row.name === '@deepseek-ai/dsh-client-ui-action-cards' && row.id !== 'dsh-science-legacy-cards-client')"
